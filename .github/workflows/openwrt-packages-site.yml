name: openwrt-packages site

on:
  schedule:
    - cron: 30 3 * * *
  repository_dispatch:
    types: [packages-site]
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # gen.py lives in this repo: openwrt-packages is wiped clean on every
      # sync, so anything committed there directly gets deleted. Check this
      # repo out first (workspace root); pkg/ is checked out after it, so
      # the checkout's clean step cannot remove pkg/.
      - name: Checkout AutoSync
        uses: actions/checkout@v7

      - name: Checkout openwrt-packages
        uses: actions/checkout@v7
        with:
          repository: kenzok8/openwrt-packages
          ref: master
          token: ${{ secrets.ACCESS_TOKEN }}
          path: pkg
          fetch-depth: 0

      - name: Generate the index
        working-directory: pkg
        run: |
          mkdir -p site
          cp ../site/gen.py site/gen.py
          touch .nojekyll
          python3 site/gen.py

      - name: Commit if changed
        working-directory: pkg
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name kenzok8
          git config user.email kenzok8@gmail.com
          git add index.html .nojekyll
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Rebuild the package index"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin HEAD:master
