name: small

on:
  push:
    paths:
      - '.github/workflows/small.yml'
      - 'commit/**'
  schedule:
    - cron: 0 */4 * * *
  repository_dispatch:
  workflow_dispatch:
    inputs:
      packages:
        description: 'packages'
        required: false
        default: 'false'

env:
  TZ: Asia/Shanghai

jobs:
  job_small:
    if: github.event.repository.owner.id == github.event.sender.id || ! github.event.sender.id
    runs-on: ubuntu-latest

    name: Update small
    strategy:
      fail-fast: false
      matrix:
        target: [master]

    steps:
    - name: Checkout
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0

    - name: Initialization environment
      run: |
        git config --global user.email "actions@github.com"
        git config --global user.name "action"

    - name: Clone packages
      run: |
        cd $GITHUB_WORKSPACE
        chmod +x .github/diy/small.sh
        git clone -b master https://github.com/kenzok8/small.git ${{matrix.target}}
        cd ${{matrix.target}}
        # 保留 .git 和 .github，只清除包目录
        find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

        $GITHUB_WORKSPACE/.github/diy/small.sh
        bash /$GITHUB_WORKSPACE/.github/diy/convert_translation.sh
        bash /$GITHUB_WORKSPACE/.github/diy/create_acl_for_luci.sh -a
        bash /$GITHUB_WORKSPACE/.github/diy/Modify.sh

    - name: Detect version-changed packages
      run: |
        cd $GITHUB_WORKSPACE/${{matrix.target}}
        : > /tmp/version_changed_packages.txt
        : > /tmp/package_version_map.txt

        # 版本取值：按 Makefile 顺序展开 $(VAR) 与 $(subst a,b,text)，得到真实字面值
        # （如 sing-box 的 1.15.0_alpha13）；全是表达式时退回 PKG_UPSTREAM_VERSION / PKG_REAL_VERSION
        cat > /tmp/get_ver.awk <<'AWK'
        function streplace(s, from, to,   out, p) {
        	if (from == "")
        		return s
        	out = ""
        	while ((p = index(s, from)) > 0) {
        		out = out substr(s, 1, p - 1) to
        		s = substr(s, p + length(from))
        	}
        	return out s
        }

        function expand(v,   name, start, i, depth, c, endpos, inner, p1, p2, from, to, text) {
        	while (match(v, /\$\([A-Za-z_][A-Za-z0-9_]*\)/)) {
        		name = substr(v, RSTART + 2, RLENGTH - 3)
        		if (!(name in lit))
        			return ""
        		v = substr(v, 1, RSTART - 1) lit[name] substr(v, RSTART + RLENGTH)
        	}
        	while ((start = index(v, "$(subst ")) > 0) {
        		depth = 0
        		endpos = 0
        		for (i = start + 1; i <= length(v); i++) {
        			c = substr(v, i, 1)
        			if (c == "(") {
        				depth++
        			} else if (c == ")") {
        				depth--
        				if (depth == 0) {
        					endpos = i
        					break
        				}
        			}
        		}
        		if (!endpos)
        			return ""
        		inner = substr(v, start + 8, endpos - start - 8)
        		p1 = index(inner, ",")
        		if (!p1)
        			return ""
        		from = substr(inner, 1, p1 - 1)
        		rest = substr(inner, p1 + 1)
        		p2 = index(rest, ",")
        		if (!p2)
        			return ""
        		to = substr(rest, 1, p2 - 1)
        		text = substr(rest, p2 + 1)
        		v = substr(v, 1, start - 1) streplace(text, from, to) substr(v, endpos + 1)
        	}
        	return v
        }

        /^[A-Za-z_][A-Za-z0-9_]*[[:space:]]*:?=/ {
        	eq = index($0, "=")
        	name = substr($0, 1, eq - 1)
        	gsub(/[[:space:]:]/, "", name)
        	val = substr($0, eq + 1)
        	sub(/^[[:space:]]*/, "", val)
        	sub(/[[:space:]]+$/, "", val)
        	names[++cnt] = name
        	vals[cnt] = val
        }

        END {
        	for (i = 1; i <= cnt; i++)
        		if (vals[i] !~ /\$\(/)
        			lit[names[i]] = vals[i]
        	for (i = 1; i <= cnt; i++) {
        		if (names[i] != "PKG_VERSION" && names[i] != "LUCI_VERSION")
        			continue
        		val = vals[i]
        		if (val ~ /\$\(/) {
        			lit[names[i]] = ver
        			val = expand(val)
        		}
        		if (val != "" && val !~ /\$\(/)
        			ver = val
        	}
        	if (ver == "")
        		ver = lit["PKG_UPSTREAM_VERSION"] lit["PKG_REAL_VERSION"]
        	print ver
        }
        AWK

        get_ver() {
          awk -f /tmp/get_ver.awk "$1"
        }

        # 遍历所有 Makefile（新包 untracked 也能捕获）
        for makefile in */Makefile; do
          [ -f "$makefile" ] || continue
          pkg=$(dirname "$makefile")
          new_ver=$(get_ver "$makefile")
          [ -z "$new_ver" ] && continue

          old_ver=""
          if git cat-file -e "HEAD:${makefile}" 2>/dev/null; then
            old_ver=$(git show "HEAD:${makefile}" | awk -f /tmp/get_ver.awk)
          fi

          if [ "$new_ver" != "$old_ver" ]; then
            echo "$pkg" >> /tmp/version_changed_packages.txt
            echo "$pkg|$new_ver" >> /tmp/package_version_map.txt
          fi
        done

        sort -u /tmp/version_changed_packages.txt -o /tmp/version_changed_packages.txt
        echo "版本变更包: $(wc -l < /tmp/version_changed_packages.txt) 个"
        cat /tmp/package_version_map.txt

    - name: 🚀 Upload
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      run: |
        cd $GITHUB_WORKSPACE/${{matrix.target}}

        git add -A
        # 不修改 README.md，始终还原为 HEAD 版本
        git checkout HEAD -- README.md 2>/dev/null || true

        if git diff --cached --quiet; then
          echo "ℹ️ nothing to commit"
          exit 0
        fi

        Emoji=("🌸" "🐌" "🌿" "⛅" "🍂" "💦" "💤" "💭" "🍭" "🎉" "🎁" "🎈" "🐾" "🎨" "💋" "🍓" "🍕" "🍉" "🙈" "🤡" "🍡")
        emoji="${Emoji[$((RANDOM % ${#Emoji[@]}))]}"

        get_pkg_version() {
          [ -s /tmp/package_version_map.txt ] || { echo ""; return; }
          awk -F'|' -v p="$1" '$1==p{print $2; exit}' /tmp/package_version_map.txt
        }

        # 处理上游 commit 信息：过滤杂乱内容，去掉重复包名前缀，截断超长
        get_upstream_msg() {
          local pkg="$1"
          [ -s /tmp/upstream_commit_msgs.txt ] || { echo ""; return; }
          local raw
          raw=$(awk -F'|' -v p="$pkg" '$1==p{sub(/^[^|]*\|/,""); print; exit}' /tmp/upstream_commit_msgs.txt)
          [ -z "$raw" ] && { echo ""; return; }

          # 过滤杂乱信息
          echo "$raw" | grep -qiE '^(Merge (pull request|branch)|Bump |bump actions|Signed-off-by:|chore: (bump|format)|Release v?[0-9]|dependabot)' \
            && { echo ""; return; }

          # 去掉 "pkgname: " 重复前缀
          local msg
          msg=$(echo "$raw" | sed "s/^${pkg}[[:space:]]*:[[:space:]]*//" | sed 's/^[[:space:]]*//')

          # 截断超长
          [ ${#msg} -gt 72 ] && msg="${msg:0:69}..."
          echo "$msg"
        }

        all_changed=$(git diff --cached --name-only -- . ':(exclude).github/**' \
          | awk -F/ 'NF>1{print $1}' | sort -u)

        # 逐包单独提交
        git reset HEAD -- . 2>/dev/null || git reset 2>/dev/null || true
        committed_any=false

        while IFS= read -r pkg; do
          [ -z "$pkg" ] && continue

          git add -A -- "$pkg/" 2>/dev/null || true
          git diff --cached --quiet && continue

          ver=$(get_pkg_version "$pkg")
          if [ -n "$ver" ]; then
            commit_msg="$pkg: update to $ver"
          else
            upstream_msg=$(get_upstream_msg "$pkg")
            if [ -n "$upstream_msg" ]; then
              commit_msg="$pkg: $upstream_msg"
            else
              commit_msg="$pkg: sync upstream"
            fi
          fi

          git commit -m "$emoji $commit_msg"
          echo "✅ $emoji $commit_msg"
          committed_any=true
        done <<< "$all_changed"

        # 处理剩余变更（根目录文件等）
        git add -A
        git checkout HEAD -- README.md 2>/dev/null || true
        if ! git diff --cached --quiet; then
          git commit -m "$emoji sync: refresh packages"
          committed_any=true
        fi

        if [ "$committed_any" = "true" ]; then
          # 认证走 Authorization 头（与 actions/checkout 同一机制）：token 嵌
          # URL 时 git 间歇性掉进交互提示分支（could not read Username），
          # 头部认证预先发送、无此环节。失败等 10 秒重试一次，两次都
          # 失败才让步骤失败，错误保持可见。
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$ACCESS_TOKEN" | base64 -w0)"
          push_ok=false
          for attempt in 1 2; do
            if git -c "http.https://github.com/.extraheader=$auth_header" push --quiet "https://github.com/kenzok8/small.git" HEAD:master; then
              push_ok=true
              break
            fi
            if [ "$attempt" = "1" ]; then
              echo "⚠️ push 失败，10 秒后重试"
              sleep 10
            fi
          done
          if [ "$push_ok" != "true" ]; then
            echo "::error::push 两次均失败"
            exit 1
          fi
          echo "✅ Push 完成"
        else
          echo "ℹ️ nothing to push"
        fi

    - name: Delete workflow runs
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        REPO: ${{ github.repository }}
        WORKFLOW_NAME: ${{ github.workflow }}
        RETAIN_DAYS: "1"
        KEEP_MINIMUM_RUNS: "1"
      run: |
        set -euo pipefail
        cutoff=$(date -u -d "${RETAIN_DAYS} days ago" +%s)
        mapfile -t runs < <(gh run list --repo "$REPO" --workflow "$WORKFLOW_NAME" --limit 200 --json databaseId,createdAt --jq '.[] | [.databaseId, .createdAt] | @tsv')
        total=${#runs[@]}
        if [ "$total" -le "$KEEP_MINIMUM_RUNS" ]; then
          echo "No workflow runs to delete ($total <= $KEEP_MINIMUM_RUNS)"
          exit 0
        fi
        index=0
        for run in "${runs[@]}"; do
          index=$((index + 1))
          if [ "$index" -le "$KEEP_MINIMUM_RUNS" ]; then
            continue
          fi
          run_id=${run%%$'\t'*}
          created_at=${run#*$'\t'}
          created_epoch=$(date -u -d "$created_at" +%s)
          if [ "$created_epoch" -gt "$cutoff" ]; then
            continue
          fi
          gh api --method DELETE "repos/$REPO/actions/runs/$run_id" || true
        done
